<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>敲鞋跟遊戲</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      color: #211919;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background:
        radial-gradient(circle at center, #fffdf4 0 20%, transparent 55%),
        #f5efd9;
    }

    header {
      height: 90px;
      padding: 15px 6vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 3px solid #211919;
    }

    h1 {
      margin: 0;
      color: #ff5a4f;
      font-size: clamp(26px, 5vw, 45px);
      transform: rotate(-3deg);
      text-shadow: 3px 3px 0 #211919;
    }

    .stats {
      display: flex;
      background: white;
      border: 3px solid #211919;
      box-shadow: 5px 5px 0 #211919;
    }

    .stats div {
      min-width: 95px;
      padding: 8px 15px;
      text-align: center;
    }

    .stats div + div {
      border-left: 3px solid #211919;
    }

    .stats small {
      display: block;
      font-size: 11px;
      letter-spacing: 2px;
    }

    .stats strong {
      font-size: 24px;
    }

    main {
      min-height: calc(100vh - 90px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .game {
      position: relative;
      width: min(700px, 100vw);
      height: 380px;
    }

    .shoe {
      position: absolute;
      width: 650px;
      height: 340px;
      left: 50%;
      top: 10px;
      transform: translateX(-50%) rotate(-7deg);
      filter: drop-shadow(0 18px 0 rgba(0, 0, 0, 0.1));
    }

    .footbed {
      position: absolute;
      z-index: 3;
      left: 100px;
      top: 145px;
      width: 470px;
      height: 85px;
      background: #ff5a4f;
      border: 5px solid #211919;
      border-radius: 70% 30% 35% 48% / 70% 55% 42% 35%;
      box-shadow: inset 0 -12px 0 #df453e;
    }

    .sole {
      position: absolute;
      z-index: 2;
      left: 95px;
      top: 210px;
      width: 485px;
      height: 35px;
      background: #211919;
      border-radius: 50%;
    }

    .strap {
      position: absolute;
      z-index: 5;
      background: #f78fb3;
      border: 5px solid #211919;
    }

    .strap.back {
      left: 135px;
      top: 35px;
      width: 115px;
      height: 150px;
      border-radius: 70px 70px 20px 20px;
      transform: rotate(-18deg);
      clip-path: polygon(0 0, 35% 0, 100% 100%, 55% 100%);
    }

    .strap.front {
      left: 440px;
      top: 80px;
      width: 145px;
      height: 115px;
      border-radius: 80px 80px 20px 20px;
      transform: rotate(12deg);
      clip-path: polygon(25% 0, 70% 0, 100% 100%, 0 100%);
    }

    .heel {
      position: absolute;
      z-index: 1;
      left: 145px;
      top: 225px;
      width: 48px;
      height: 120px;
      min-height: 20px;
      background: #ff5a4f;
      border: 5px solid #211919;
      border-radius: 3px 3px 14px 14px;
      transform: skew(-7deg);
      transform-origin: top;
      transition: height 0.2s cubic-bezier(.2, .9, .3, 1.5);
    }

    .target {
      position: absolute;
      z-index: 10;
      left: 95px;
      top: 195px;
      width: 145px;
      height: 175px;
      padding: 0;
      border: none;
      background: transparent;
      cursor: crosshair;
    }

    .target span {
      position: absolute;
      left: 10px;
      bottom: 10px;
      width: 105px;
      height: 105px;
      display: grid;
      place-items: center;
      color: #ff5a4f;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.6);
      border: 5px solid #ff5a4f;
      border-radius: 50%;
      animation: pulse 1s infinite;
    }

    .target:disabled {
      cursor: default;
    }

    .target:disabled span {
      display: none;
    }

    .impact {
      position: absolute;
      z-index: 20;
      left: 70px;
      top: 185px;
      color: #f7d84b;
      font-size: 55px;
      font-weight: 900;
      opacity: 0;
      -webkit-text-stroke: 3px #211919;
      pointer-events: none;
    }

    .impact.show {
      animation: impact 0.35s;
    }

    .success {
      display: none;
      position: absolute;
      z-index: 20;
      right: 30px;
      top: 25px;
      padding: 12px 20px;
      color: #ff5a4f;
      background: #f7d84b;
      border: 6px double #211919;
      font-size: 45px;
      font-weight: 900;
      transform: rotate(9deg);
    }

    .panel {
      width: min(420px, 90vw);
      padding: 15px;
      text-align: center;
      background: white;
      border: 3px solid #211919;
      box-shadow: 6px 6px 0 #211919;
    }

    .height {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
    }

    .meter {
      height: 18px;
      margin: 10px 0;
      overflow: hidden;
      background: white;
      border: 3px solid #211919;
    }

    .meter div {
      width: 100%;
      height: 100%;
      background: #ff5a4f;
      transition: width 0.2s;
    }

    #message {
      margin: 10px 0;
      font-weight: bold;
    }

    #start {
      padding: 14px 28px;
      color: white;
      background: #211919;
      border: 0;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 6px 6px 0 #ff5a4f;
    }

    #start:hover {
      transform: translate(-2px, -2px);
      box-shadow: 8px 8px 0 #ff5a4f;
    }

    @keyframes pulse {
      50% {
        opacity: 0.65;
        transform: scale(0.9);
      }
    }

    @keyframes impact {
      0% {
        opacity: 0;
        transform: scale(0.3) rotate(-15deg);
      }

      50% {
        opacity: 1;
        transform: scale(1.2) rotate(-5deg);
      }

      100% {
        opacity: 0;
        transform: scale(1.5) rotate(8deg);
      }
    }

    @media (max-width: 700px) {
      header {
        height: 75px;
        padding: 10px 15px;
      }

      .stats div {
        min-width: 70px;
        padding: 5px 8px;
      }

      .stats strong {
        font-size: 19px;
      }

      .game {
        width: 650px;
        height: 310px;
        transform: scale(0.7);
        margin: -35px 0;
      }
    }

    @media (max-width: 450px) {
      .game {
        transform: scale(0.56);
        margin: -65px 0;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>HEEL DOWN!</h1>

    <div class="stats">
      <div>
        <small>得分</small>
        <strong id="score">0000</strong>
      </div>

      <div>
        <small>時間</small>
        <strong><span id="time">30</span>s</strong>
      </div>
    </div>
  </header>

  <main>
    <div class="game">
      <div class="shoe">
        <div class="strap back"></div>
        <div class="footbed"></div>
        <div class="strap front"></div>
        <div class="heel" id="heel"></div>
        <div class="sole"></div>

        <button class="target" id="target" disabled>
          <span>敲這裡</span>
        </button>

        <div class="impact" id="impact">啪！</div>
        <div class="success" id="success">FLAT!</div>
      </div>
    </div>

    <div class="panel">
      <div class="height">
        <span>鞋跟高度</span>
        <span id="heightText">12.0 cm</span>
      </div>

      <div class="meter">
        <div id="meter"></div>
      </div>

      <p id="message">連敲 8 下，把高跟鞋變成平底涼鞋！</p>
      <button id="start">開始敲鞋跟</button>
    </div>
  </main>

  <script>
    const maximumHits = 8;

    let hits = 0;
    let score = 0;
    let time = 30;
    let playing = false;
    let timer = null;

    const heel = document.querySelector("#heel");
    const target = document.querySelector("#target");
    const impact = document.querySelector("#impact");
    const success = document.querySelector("#success");
    const scoreText = document.querySelector("#score");
    const timeText = document.querySelector("#time");
    const heightText = document.querySelector("#heightText");
    const meter = document.querySelector("#meter");
    const message = document.querySelector("#message");
    const startButton = document.querySelector("#start");

    function updateScreen() {
      const progress = hits / maximumHits;
      const height = Math.max(0, 12 - hits * 1.5);

      heel.style.height = `${120 - progress * 100}px`;
      meter.style.width = `${100 - progress * 100}%`;

      scoreText.textContent = String(score).padStart(4, "0");
      timeText.textContent = time;
      heightText.textContent = `${height.toFixed(1)} cm`;
    }

    function startGame() {
      clearInterval(timer);

      hits = 0;
      score = 0;
      time = 30;
      playing = true;

      target.disabled = false;
      success.style.display = "none";
      message.textContent = "瞄準紅色靶心，用力敲！";
      startButton.textContent = "重新開始";

      updateScreen();

      timer = setInterval(() => {
        time--;
        updateScreen();

        if (time <= 0) {
          finishGame(false);
        }
      }, 1000);
    }

    function hitHeel() {
      if (!playing) return;

      hits++;
      score += 125 + hits * 25;

      impact.classList.remove("show");
      void impact.offsetWidth;
      impact.classList.add("show");

      if (navigator.vibrate) {
        navigator.vibrate(40);
      }

      if (hits >= maximumHits) {
        finishGame(true);
      } else if (hits >= 5) {
        message.textContent = "快成功了，再幾下！";
      } else {
        message.textContent = "喀！鞋跟正在變短！";
      }

      updateScreen();
    }

    function finishGame(won) {
      playing = false;
      target.disabled = true;
      clearInterval(timer);

      if (won) {
        success.style.display = "block";
        message.textContent = "完成！高跟鞋變成平底涼鞋了！";
        startButton.textContent = "再改一雙";
      } else {
        message.textContent = "時間到！再試一次吧。";
        startButton.textContent = "重新挑戰";
      }
    }

    startButton.addEventListener("click", startGame);
    target.addEventListener("click", hitHeel);

    updateScreen();
  </script>
</body>
</html>
